<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processamento e envase | DemoFoods</title>
<meta name="description" content="Painel de acompanhamento de processamento e envase em três fábricas, com dados fictícios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --sunk:#ECEEF0; --ink:#1E2227; --ink-2:#434A53; --muted:#69727D; --line:#D9DDE1;
  --accent:#2F6690;
  --f1:#2F6690; --f2:#B7792B; --f3:#5E7F45;
  --d-env:#2B4C66; --d-apr:#8DB4D3; --d-ret:#D9A43B; --d-desc:#B3B8BE;
  --t-var:#2F6690; --t-ind:#B7792B;
  --p-prev:#C9D6E2; --p-proc:#6F95B6; --p-env:#2B4C66;
  --crit:#B3261E; --warn:#A86A00; --info:#69727D; --ok:#3F7A3A;
  --crit-soft:#F7E3E1; --warn-soft:#F6ECD9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181B; --surface:#1D2125; --sunk:#252A2F; --ink:#E6E9EC; --ink-2:#C2C8CE; --muted:#929BA5; --line:#30363C;
  --accent:#7FAED3;
  --f1:#6E9FC9; --f2:#D49A4E; --f3:#89A96E;
  --d-env:#7FAED3; --d-apr:#3E6584; --d-ret:#C99232; --d-desc:#59606A;
  --t-var:#6E9FC9; --t-ind:#D49A4E;
  --p-prev:#3A4652; --p-proc:#5A82A5; --p-env:#9CC2E2;
  --crit:#EF8A80; --warn:#E3B04F; --info:#929BA5; --ok:#8CC285;
  --crit-soft:#3A2321; --warn-soft:#352C1C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1D2125; --sunk:#252A2F; --ink:#E6E9EC; --ink-2:#C2C8CE; --muted:#929BA5; --line:#30363C;
  --accent:#7FAED3;
  --f1:#6E9FC9; --f2:#D49A4E; --f3:#89A96E;
  --d-env:#7FAED3; --d-apr:#3E6584; --d-ret:#C99232; --d-desc:#59606A;
  --t-var:#6E9FC9; --t-ind:#D49A4E;
  --p-prev:#3A4652; --p-proc:#5A82A5; --p-env:#9CC2E2;
  --crit:#EF8A80; --warn:#E3B04F; --info:#929BA5; --ok:#8CC285;
  --crit-soft:#3A2321; --warn-soft:#352C1C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num,td.r,th.r{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 48px}

/* aviso de demonstração */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo .wrap{display:flex;gap:8px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.demo a{color:inherit}
.demo .acts{display:flex;gap:16px;align-items:center}
.lang{display:inline-flex;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:3px;overflow:hidden}
.lang button{background:none;border:0;color:inherit;padding:2px 8px;cursor:pointer;font-size:12px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between;padding:22px 0 14px}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted)}
.stamp{color:var(--muted);font-size:13px}

/* filtros e abas */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:500}
select,input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:0 8px;height:32px;color:var(--ink)}
select:hover,input[type=date]:hover{border-color:var(--muted)}
.btn{background:none;border:1px solid var(--line);border-radius:3px;padding:0 12px;height:32px;cursor:pointer;color:var(--ink-2);font-weight:500}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{display:inline-block;margin-left:6px;padding:0 6px;border-radius:2px;background:var(--crit);color:#fff;font-size:11px;line-height:17px;vertical-align:1px}

/* conteúdo */
.panel{display:grid;gap:18px;padding-top:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:3px}
.kpi{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(540px,100%),1fr));gap:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px 16px 16px;min-width:0}
.box h2{margin:0;font-size:15px;font-weight:600}
.box .sub{margin:1px 0 10px;color:var(--muted);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:6px;vertical-align:-1px}
.cv{position:relative;height:270px}
.cv.tall{height:330px}
.note{color:var(--muted);font-size:12.5px;margin:0}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--ink-2);border-bottom:0}
td .dot+*,td:has(>span>.dot){white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
.code{letter-spacing:.01em;white-space:nowrap}
.neg{color:var(--crit)}
.scroll{max-height:460px;overflow:auto}
.scroll thead th{position:sticky;top:0;background:var(--surface)}

/* alertas */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.chip b{margin-left:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
#tbAl td:first-child{padding-left:10px;border-left:3px solid transparent}
#tbAl tr.crit td:first-child{border-left-color:var(--crit)}
#tbAl tr.warn td:first-child{border-left-color:var(--warn)}
#tbAl tr.info td:first-child{border-left-color:var(--line)}
#tbAl tr.crit{background:color-mix(in srgb,var(--crit-soft) 55%,transparent)}
#tbAl th:first-child{padding-left:13px}
.sev{font-weight:600;font-size:12.5px;white-space:nowrap}
.sev.crit{color:var(--crit)} .sev.warn{color:var(--warn)} .sev.info{color:var(--info)}
.empty{color:var(--muted);padding:16px 0}

@media (max-width:700px){
  .wrap{padding-left:16px;padding-right:16px}
  .top h1{font-size:21px}
  .kpi{border-left:0;border-top:1px solid var(--line)}
  .kpi:first-child{border-top:0}
  .kpi .v{font-size:22px}
  .cv{height:230px}.cv.tall{height:290px}
  .f{flex:1 1 140px}
  .f select,.f input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="demo">
  <div class="wrap">
    <span data-t="aviso"></span>
    <span class="acts">
      <span class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button>
      </span>
      <a href="../" data-t="voltar"></a>
    </span>
  </div>
</div>

<div class="wrap" style="padding-bottom:0">
  <header class="top">
    <div>
      <h1 data-t="titulo"></h1>
      <p data-t="subtitulo"></p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
</div>

<div class="bar">
  <div class="wrap" style="padding-bottom:0">
    <div class="filters">
      <div class="f"><label for="fF" data-t="f_fabrica"></label><select id="fF"></select></div>
      <div class="f"><label for="fP" data-t="f_produto"></label><select id="fP"></select></div>
      <div class="f"><label for="fC" data-t="f_categoria"></label><select id="fC"></select></div>
      <div class="f"><label for="fR" data-t="f_periodo"></label><select id="fR"></select></div>
      <div class="f"><label for="fD1" data-t="f_de"></label><input type="date" id="fD1"></div>
      <div class="f"><label for="fD2" data-t="f_ate"></label><input type="date" id="fD2"></div>
      <button class="btn" id="fClear" type="button" data-t="limpar"></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="visao" data-t="t_visao"></button>
      <button class="tab" role="tab" data-tab="proc" data-t="t_proc"></button>
      <button class="tab" role="tab" data-tab="env" data-t="t_env"></button>
      <button class="tab" role="tab" data-tab="mp" data-t="t_mp"></button>
      <button class="tab" role="tab" data-tab="alertas"><span data-t="t_alertas"></span><span class="cnt" id="alCnt"></span></button>
    </nav>
  </div>
</div>

<main class="wrap">
  <!-- VISÃO GERAL -->
  <section class="panel" id="p-visao" role="tabpanel">
    <div class="kpis" id="kVisao"></div>
    <div class="grid2">
      <div class="box"><h2 data-t="g_proc_sem"></h2><p class="sub" data-t="g_proc_sem_s"></p>
        <div class="legend" id="lgF1"></div><div class="cv"><canvas id="chProcSem"></canvas></div></div>
      <div class="box"><h2 data-t="g_env_sem"></h2><p class="sub" data-t="g_env_sem_s"></p>
        <div class="legend" id="lgF2"></div><div class="cv"><canvas id="chEnvSem"></canvas></div></div>
    </div>
    <div class="box"><h2 data-t="tb_fab"></h2><p class="sub" data-t="tb_fab_s"></p>
      <div class="tw"><table id="tbFab"></table></div></div>
  </section>

  <!-- PROCESSAMENTO -->
  <section class="panel" id="p-proc" role="tabpanel" hidden>
    <div class="kpis" id="kProc"></div>
    <div class="box"><h2 data-t="tb_status"></h2><p class="sub" data-t="tb_status_s"></p>
      <div class="tw"><table id="tbStatus"></table></div></div>
    <div class="grid2">
      <div class="box"><h2 data-t="g_dest_prod"></h2><p class="sub" data-t="un_label"></p>
        <div class="legend" id="lgD1"></div><div class="cv tall"><canvas id="chProd"></canvas></div></div>
      <div class="box"><h2 data-t="g_cat"></h2><p class="sub" data-t="g_cat_s"></p>
        <div class="legend" id="lgD2"></div><div class="cv tall"><canvas id="chCat"></canvas></div></div>
    </div>
  </section>

  <!-- ENVASE -->
  <section class="panel" id="p-env" role="tabpanel" hidden>
    <div class="kpis" id="kEnv"></div>
    <div class="grid2">
      <div class="box"><h2 data-t="g_tipo_sem"></h2><p class="sub" data-t="g_env_sem_s"></p>
        <div class="legend" id="lgT1"></div><div class="cv"><canvas id="chTipo"></canvas></div></div>
      <div class="box"><h2 data-t="g_emb"></h2><p class="sub" data-t="g_emb_s"></p>
        <div class="legend" id="lgE"></div><div class="cv"><canvas id="chEmb"></canvas></div></div>
    </div>
    <div class="box"><h2 data-t="tb_prod_env"></h2><p class="sub" data-t="tb_prod_env_s"></p>
      <div class="tw"><table id="tbProdEnv"></table></div></div>
    <div class="box"><h2 data-t="tb_fora"></h2><p class="sub" id="foraSub"></p>
      <div class="tw scroll"><table id="tbFora"></table></div><p class="empty" id="foraEmpty" hidden data-t="nada_fora"></p></div>
  </section>

  <!-- MATÉRIA-PRIMA -->
  <section class="panel" id="p-mp" role="tabpanel" hidden>
    <div class="kpis" id="kMp"></div>
    <div class="grid2">
      <div class="box"><h2 data-t="g_ppe"></h2><p class="sub" data-t="g_ppe_s"></p>
        <div class="legend" id="lgPh"></div><div class="cv"><canvas id="chPpe"></canvas></div></div>
      <div class="box"><h2 data-t="g_fase"></h2><p class="sub" data-t="g_fase_s"></p>
        <div class="legend" id="lgFase"></div><div class="cv"><canvas id="chFase"></canvas></div></div>
    </div>
    <div class="box"><h2 data-t="tb_mp_fab"></h2><p class="sub" data-t="tb_mp_fab_s"></p>
      <div class="tw"><table id="tbMpFab"></table></div></div>
    <div class="box"><h2 data-t="tb_mp"></h2><p class="sub" data-t="tb_mp_s"></p>
      <div class="tw scroll"><table id="tbMp"></table></div></div>
    <p class="note" data-t="nota_mp"></p>
  </section>

  <!-- ALERTAS -->
  <section class="panel" id="p-alertas" role="tabpanel" hidden>
    <div class="box">
      <h2 data-t="al_titulo"></h2>
      <p class="sub" id="alSub"></p>
      <div class="chips" id="alChips"></div>
    </div>
    <div class="box"><div class="tw scroll" style="max-height:620px"><table id="tbAl"></table></div><p class="empty" id="alEmpty" hidden data-t="nada_alerta"></p></div>
    <p class="note" data-t="nota_al"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

      if(w<=p.width+4){ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillText(s,p.x,p.y-3);}else{ctx.save();ctx.translate(p.x,p.y-4);ctx.rotate(-Math.PI/2);ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(s,0,0);ctx.restore();}});});ctx.restore();return;}

function wkey(iso){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10);}
function weeks(a,b){const out=[];let k=wkey(a);const e=wkey(b);while(k<=e){out.push(k);const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+7);k=d.toISOString().slice(0,10);}return out;}

    [t("k_env"),n0(unE),t("un"),n1(tn(kgE))+" t, "+n0(E.length)+" "+t("lotes_finais")],
    [t("k_env_pct"),pc(env/un),"",n0(env)+" "+t("un")],

    return[n0(u),n0(sum(e,r=>r.un)),pc(q("Envasado")/u),n0(q("Aprovado – não envasado")),n0(q("Descarte")),n1(tn(sum(p,r=>r.kg))),n1(tn(sum(e,r=>r.kg)))];};

    return[v(x)].concat(fs.map(f=>{const q=sum(p.filter(r=>r.fabrica===f),r=>r.un);return q?n0(q):"–";}),[n0(p.length),n0(u),pc(u/un),n1(tn(sum(p,r=>r.kg)))]);});
  table("tbStatus",[[t("c_status")]].concat(fs.map(f=>[v(f),1]),[[t("c_lotes"),1],[t("c_total_un"),1],[t("c_pct"),1],[t("c_t"),1]]),rows,

    [v("Industrial"),n0(sum(ind,r=>r.un)),t("un"),n0(sum(ind,r=>r.packs))+" "+t("packs")+", "+pc(sum(ind,r=>r.un)/u)],
    [t("k_fora"),n0(fora.length),t("lotes"),pc(fora.length/comLanc.length)+" "+t("dos_lotes")],
    [t("k_semlanc"),n0(sem.length),t("lotes"),""],
  ]);
  const wk=weeks(S.d1,S.d2);legend("lgT1",TIPOS);
  const m=byWeek(E,r=>r.data_inicial,r=>r.tipo,r=>r.un,["Varejo","Industrial"],wk);
  chart("chTipo",{type:"bar",data:{labels:wk.map(fw),datasets:TIPOS.map(([tp,c])=>ds(v(tp),wk.map(k=>m[tp][k]),c))},options:weekly(opts())},t("un"));
  const itens=["Varejo P","Varejo M","Varejo G","Varejo GG","Industrial padrão","Industrial grande"].filter(i=>comLanc.some(r=>r.embalagem===i));
  legend("lgE",TIPOS);
  const dev=itens.map(i=>{const g=comLanc.filter(r=>r.embalagem===i);return sum(g,r=>r.emb_consumidas)/sum(g,r=>r.emb_projetadas)-1;});
  const oe=opts();oe.plugins.vals.fmt="pct";oe.scales.y.ticks.callback=x=>NF1.format(x*100)+"%";oe.scales.y.beginAtZero=true;
  oe.plugins.tooltip.callbacks.label=c=>" "+pcs(c.parsed.y);oe.scales.x.ticks.maxRotation=0;oe.scales.x.ticks.autoSkip=false;
  chart("chEmb",{type:"bar",data:{labels:itens.map(i=>v(i).split(" ")),datasets:[{label:t("c_desvio"),data:dev,borderWidth:0,borderRadius:1,maxBarThickness:46,
    backgroundColor:itens.map(i=>css(i.startsWith("Industrial")?"--t-ind":"--t-var"))}]},options:oe});
  const linha=e=>{const vv=sum(e.filter(r=>r.tipo==="Varejo"),r=>r.un),ii=sum(e.filter(r=>r.tipo==="Industrial"),r=>r.un),kg=sum(e,r=>r.kg);
    return[n0(e.length),n0(vv),n0(ii),n0(sum(e,r=>r.packs)),n0(vv+ii),pc(ii/(vv+ii)),n1(tn(kg)),NF2.format(kg/(vv+ii))];};
  const prods=[...new Set(E.map(r=>r.produto))].sort();
  table("tbProdEnv",[[t("c_produto")],[t("c_lotes"),1],[t("c_var"),1],[t("c_ind"),1],[t("c_packs"),1],[t("c_tot"),1],[t("c_pind"),1],[t("c_env_t2"),1],[t("c_peso"),1]],
    prods.map(p=>[p].concat(linha(E.filter(r=>r.produto===p)))),E.length?[t("total")].concat(linha(E)):null);
  $("foraSub").textContent=t("fora_sub",{v:Math.round(D.meta.regras.tol_emb_varejo*100)+"%",i:D.meta.regras.tol_emb_industrial});
  const F=[...fora].sort((a,b)=>Math.abs(b.desvio_emb)-Math.abs(a.desvio_emb));
  table("tbFora",[[t("c_lote_final")],[t("c_fabrica")],[t("c_produto")],[t("c_tipo")],[t("c_emb")],[t("c_proj"),1],[t("c_cons"),1],[t("c_desvio"),1],[t("c_data"),1]],
    F.map(r=>[code(r.lote_final),dot(v(r.fabrica),FCOL(r.fabrica)),r.produto,v(r.tipo),v(r.embalagem),n0(r.emb_projetadas),n0(r.emb_consumidas),
      r.tipo==="Industrial"?sg(r.emb_consumidas-r.emb_projetadas):pcs(r.desvio_emb),fd(r.data_inicial)]));
  $("foraEmpty").hidden=F.length>0;$("tbFora").hidden=!F.length;
}

/* ================= matéria-prima ================= */
function rMp(){
  const L=fMp(),fs=fabs();
  const prev=sum(L,r=>r.previsao),proc=sum(L,r=>r.processado),env=sum(L,r=>r.envasado),desc=sum(L,r=>r.descarte),saldo=sum(L,r=>r.saldo);
  const abertos=L.filter(r=>r.fase!=="Finalizado"&&r.processado>0);
  kpis("kMp",[
    [t("k_prev"),n0(prev),t("un"),n0(L.length)+" "+t("lotes_mp")],
    [t("k_mp_proc"),n0(proc),t("un"),pc(proc/prev)+" "+t("da_prev")],
    [t("k_mp_env"),n0(env),t("un"),pc(env/(proc-desc))+" "+(LANG==="pt"?"do aprovado":"of approved")],
    [t("k_saldo"),n0(saldo),t("un"),n0(abertos.length)+" "+t("lotes_abertos")],
    [t("k_desc"),n0(desc),t("un"),pc(desc/proc)+" "+t("do_proc")],
  ]);
  const PH=[["k_prev","--p-prev","previsao"],["k_mp_proc","--p-proc","processado"],["k_mp_env","--p-env","envasado"]];
  legend("lgPh",PH.map(([k,c])=>[t(k),c]));
  const og=opts();og.plugins.vals.grouped=true;og.layout.padding.top=24;
  chart("chPpe",{type:"bar",data:{labels:fs.map(v),datasets:PH.map(([k,c,f])=>ds(t(k),fs.map(x=>sum(L.filter(r=>r.fabrica===x),r=>r[f])),c,52))},options:og},t("un"));
  const fz=FASES.filter(([f])=>L.some(r=>r.fase===f));legend("lgFase",fz);
  const oh=hopts();oh.scales.x.ticks.precision=0;
  chart("chFase",{type:"bar",data:{labels:fs.map(v),datasets:fz.map(([f,c])=>ds(v(f),fs.map(x=>L.filter(r=>r.fabrica===x&&r.fase===f).length||null),c,34))},options:oh},t("lotes"));
  const rel=(a,b)=>b?pcs(a/b-1):"–";
  const linha=l=>{const pf=l.filter(r=>r.sit_processamento==="Finalizado"&&r.previsao),ef=l.filter(r=>r.fase==="Finalizado");
    return[n0(l.length),n0(sum(l,r=>r.previsao)),n0(sum(l,r=>r.processado)),n0(sum(l,r=>r.envasado)),rel(sum(pf,r=>r.processado),sum(pf,r=>r.previsao)),rel(sum(ef,r=>r.envasado),sum(ef,r=>r.processado-r.descarte)),n0(sum(l,r=>r.saldo)),n0(sum(l,r=>r.descarte))];};
  const H=[[t("c_lotes_mp"),1],[t("c_prev"),1],[t("k_mp_proc"),1],[t("k_mp_env"),1],[t("c_procx"),1],[t("c_envx"),1],[t("c_saldo"),1],[t("k_desc"),1]];
  table("tbMpFab",[[t("c_fabrica")]].concat(H),fs.map(f=>[dot(v(f),FCOL(f))].concat(linha(L.filter(r=>r.fabrica===f)))),fs.length>1?[t("total")].concat(linha(L)):null);
  const ord={"Em envase":0,"Em processamento":1,"Não iniciado":2,"Finalizado":3};
  const LL=[...L].sort((a,b)=>a.fabrica.localeCompare(b.fabrica)||ord[a.fase]-ord[b.fase]||(b.saldo||0)-(a.saldo||0));
  const fcol=f=>(FASES.find(x=>x[0]===f)||FASES[3])[1];
  table("tbMp",[[t("c_lote_mp")],[t("c_fornecedor")],[t("c_produto")],[t("c_fabrica")],[t("c_fase")],[t("c_entrada"),1],[t("c_prev"),1],[t("k_mp_proc"),1],[t("k_mp_env"),1],[t("c_saldo"),1],[t("c_dif"),1],[t("k_desc"),1]],
    LL.map(r=>[code(r.lote_mp),v(r.fornecedor),r.produto,v(r.fabrica),dot(v(r.fase),fcol(r.fase)),fd(r.entrada),r.previsao==null?"–":n0(r.previsao),n0(r.processado),n0(r.envasado),
      r.fase==="Finalizado"||r.fase==="Não iniciado"?"–":n0(r.saldo),r.dif_final==null?"–":{node:Object.assign(document.createElement("span"),{textContent:sg(r.dif_final),className:r.dif_final<0?"neg":""})},r.descarte?n0(r.descarte):"–"]));
}

/* ================= alertas ================= */
function rAlertas(){
  const A=fAl();
  $("alCnt").textContent=A.filter(a=>a.nivel!=="Info").length||"";
  if(S.tab!=="alertas")return;
  const tipos={};A.forEach(a=>{tipos[a.tipo]=(tipos[a.tipo]||0)+1;});
  const ch=$("alChips");ch.innerHTML="";
  [["",A.length,LANG==="pt"?"Todos":"All"]].concat(Object.entries(tipos).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[k,n,v(k)])).forEach(([k,n,l])=>{
    const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",S.al===k);b.append(l);const bb=document.createElement("b");bb.textContent=n;b.appendChild(bb);b.onclick=()=>{S.al=k;rAlertas();};ch.appendChild(b);});
  const r=D.meta.regras;
  $("alSub").textContent=t("al_sub",{c:A.filter(a=>a.nivel==="Crítico").length,a:A.filter(a=>a.nivel==="Atenção").length,r:Math.round(r.tol_rendimento*100)+"%",rc:Math.round(r.tol_rendimento_critico*100)+"%"});
  const ordem={"Crítico":0,"Atenção":1,"Info":2};
  const L=A.filter(a=>!S.al||a.tipo===S.al).sort((a,b)=>ordem[a.nivel]-ordem[b.nivel]||(b.data||"").localeCompare(a.data||""));
  table("tbAl",[[t("c_nivel")],[t("c_tipo")],[t("c_fabrica")],[t("c_lote")],[t("c_produto")],[t("c_detalhe")],[t("c_data"),1]],
    L.map(a=>{const s=document.createElement("span");s.className="sev "+NIVEL[a.nivel];s.textContent=v(a.nivel);
      return{cls:NIVEL[a.nivel],cells:[{node:s},v(a.tipo),dot(v(a.fabrica),FCOL(a.fabrica)),code(v(a.lote)),a.produto||"–",a.detalhe[LANG]||a.detalhe.pt,fd(a.data)]};}));
  $("alEmpty").hidden=L.length>0;$("tbAl").hidden=!L.length;
}

/* ================= idioma, abas, render ================= */
function applyLang(){
  document.documentElement.lang=LANG==="pt"?"pt-BR":"en";setNumbers();
  document.title=t("titulo")+" | DemoFoods";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  $("stamp").textContent=t("dados_ate",{d:fd(D?D.meta.fim:"")});
  if(D){fillFilters();render();}
}
function setTab(tab){S.tab=tab;store.set("tab",tab);document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));document.querySelectorAll("[role=tabpanel]").forEach(p=>p.hidden=p.id!=="p-"+tab);render();}
function render(){
  if(typeof Chart==="undefined"){fail(t("erro_graf"));return;}
  rAlertas();({visao:rVisao,proc:rProc,env:rEnv,mp:rMp,alertas:()=>{}})[S.tab]();
}
function fail(msg){const p=document.createElement("p");p.className="empty";p.textContent=msg;document.querySelector("main").prepend(p);}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;langSet(LANG);applyLang();});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{setTab(b.dataset.tab);try{history.replaceState(null,"","#"+b.dataset.tab)}catch(e){}});
document.documentElement.style.setProperty("--ff",'"Public Sans",system-ui,sans-serif');
if(window.Chart)Chart.register(VALS);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>D&&render());}catch(e){}

(async()=>{
  applyLang();
  try{D=window.__DADOS__||await (await fetch("../dados/monitoramento.json")).json();}catch(e){fail(t("erro_dados"));return;}
  FAB=D.fabricas;S={f:"",p:"",c:"",d1:D.meta.inicio,d2:D.meta.fim,tab:"visao",al:""};
  initFilters();applyLang();
  const h=(location.hash||"").slice(1);
  setTab(["visao","proc","env","mp","alertas"].includes(h)?h:(store.get("tab")||"visao"));
})();
</script>
